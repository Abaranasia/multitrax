name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 11

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'pnpm'

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Typecheck
        run: pnpm typecheck

      - name: Lint
        run: pnpm lint

      - name: Test
        run: pnpm test:no-watch

      - name: Build
        run: pnpm build

      - name: Package (electron-builder config smoke test)
        # Unpacked (--dir) rather than a full AppImage/installer: this only
        # needs to prove package.json's "build" config (appId, files glob,
        # output dir, per-platform target sections) still resolves and
        # packages cleanly, not to produce a distributable artifact — that
        # belongs in a dedicated release workflow.
        run: pnpm exec electron-builder --dir --publish=never
